[build-system]
requires=["setuptools>=69","wheel"]
build-backend="setuptools.build_meta"
[project]
name="proposal-deck-creation"
version="0.1.0"
requires-python=">=3.11"
dependencies=["boto3>=1.42.0","fastapi>=0.116.0","uvicorn[standard]>=0.35.0","python-multipart>=0.0.20","pydantic>=2.11.0","pydantic-settings>=2.10.0","langgraph>=0.6.0","python-pptx>=1.0.2","python-docx>=1.2.0","pypdf>=6.0.0","structlog>=25.4.0"]
[project.optional-dependencies]
dev=["pytest>=8.4.0","httpx>=0.28.0","ruff>=0.13.0"]
[tool.setuptools.packages.find]
include=["app*"]
